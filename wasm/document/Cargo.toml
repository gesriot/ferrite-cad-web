[package]
name = "ferritecad-document-wasm-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
ferritecad-document = { git = "https://github.com/gesriot/ferrite-cad", rev = "1b645299b206f3f87e9d3d9959428d2b245d6219" }
ferritecad-types = { git = "https://github.com/gesriot/ferrite-cad", rev = "1b645299b206f3f87e9d3d9959428d2b245d6219" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
